<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デジタル日めくり</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  background: #fff8e8;
  color: #111;
  font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

.container {
  width: 100%;
  padding: 3vh 4vw;
}

.period {
  font-size: 6vw;
  font-weight: bold;
  margin-bottom: 2vh;
}

.time {
  font-size: 8vw;
  font-weight: bold;
  margin-bottom: 3vh;
}

.year {
  font-size: 6vw;
  margin-bottom: 3vh;
  line-height: 1.3;
}

.date {
  font-size: 16vw;
  font-weight: bold;
  line-height: 1.1;
}

.weekday {
  font-size: 14vw;
  font-weight: bold;
  margin-top: 2vh;
}

.message {
  font-size: 5vw;
  margin-top: 4vh;
  line-height: 1.4;
}

@media (orientation: portrait) {
  .period { font-size: 7vw; }
  .time { font-size: 10vw; }
  .year { font-size: 7vw; }
  .date { font-size: 18vw; }
  .weekday { font-size: 16vw; }
  .message { font-size: 6vw; }
}
</style>
</head>

<body>
<div class="container">
  <div class="year" id="year"></div>
  <div class="date" id="date"></div>
  <div class="weekday" id="weekday"></div>
  <div class="period" id="period"></div>
  <div class="time" id="time"></div>
  <div class="message" id="message"></div>
</div>
  
<script>
function updateCalendar() {
  const now = new Date();

  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const hour = now.getHours();
  const minute = now.getMinutes();

  const weekdays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日"];
  const weekday = weekdays[now.getDay()];

  const reiwa = y - 2018;

  let period = "";
  let message = "";

  if (hour >= 4 && hour < 10) {
    period = "朝です";
    message = "今日もゆっくり始めましょう";
  } else if (hour >= 10 && hour < 12) {
    period = "午前です";
    message = "今日は何曜日か確認しましょう";
  } else if (hour >= 12 && hour < 17) {
    period = "午後です";
    message = "無理せず過ごしましょう";
  } else if (hour >= 17 && hour < 21) {
    period = "夕方です";
    message = "そろそろ夜の時間です";
  } else {
    period = "夜です";
    message = "おやすみの準備をしましょう";
  }

  const mm = String(minute).padStart(2, "0");

  document.getElementById("period").textContent = period;
  document.getElementById("time").textContent = hour + ":" + mm;
  document.getElementById("year").innerHTML = y + "年<br>令和" + reiwa + "年";
  document.getElementById("date").textContent = m + "月" + d + "日";
  document.getElementById("weekday").textContent = weekday;
  document.getElementById("message").textContent = message;
}

updateCalendar();
setInterval(updateCalendar, 1000);
</script>
</body>
</html>
