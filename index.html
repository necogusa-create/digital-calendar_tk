<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デジタル日めくり</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  background: #fff8e8;
  color: #111;
  font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

.container {
  width: 100%;
  padding: 3vh 4vw;
}

.year {
  font-size: 5vw;
  margin-bottom: 2vh;
  line-height: 1.3;
}

.date {
  font-size: 14vw;
  font-weight: bold;
  line-height: 1.1;
}

.weekday {
  font-size: 12vw;
  font-weight: bold;
  margin-top: 1vh;
}

.period {
  font-size: 5vw;
  font-weight: bold;
  margin-top: 2vh;
}

.time {
  font-size: 7vw;
  font-weight: bold;
  margin-top: 1vh;
}

.schedule {
  margin-top: 3vh;
  padding-top: 2vh;
  border-top: 0.4vw solid #333;
}

.schedule-title {
  font-size: 5vw;
  font-weight: bold;
  margin-bottom: 1vh;
}

.schedule-item {
  font-size: 5vw;
  font-weight: bold;
  line-height: 1.35;
  margin-top: 1vh;
}

.schedule-empty {
  font-size: 5vw;
  line-height: 1.4;
}

.message {
  font-size: 4vw;
  margin-top: 2vh;
  line-height: 1.4;
}

@media (orientation: portrait) {
  .year { font-size: 6vw; }
  .date { font-size: 16vw; }
  .weekday { font-size: 14vw; }
  .period { font-size: 6vw; }
  .time { font-size: 9vw; }
  .schedule-title { font-size: 6vw; }
  .schedule-item { font-size: 6vw; }
  .schedule-empty { font-size: 6vw; }
  .message { font-size: 5vw; }
}
</style>
</head>

<body>

<div class="container">
  <div class="year" id="year"></div>
  <div class="date" id="date"></div>
  <div class="weekday" id="weekday"></div>
  <div class="period" id="period"></div>
  <div class="time" id="time"></div>

  <div class="schedule">
    <div class="schedule-title">今日の予定</div>
    <div id="scheduleList" class="schedule-empty">読み込み中です</div>
  </div>

  <div class="message" id="message"></div>
</div>

<script>
const SCHEDULE_URL = "ここにApps ScriptのウェブアプリURLを貼る";

function updateCalendar() {
  const now = new Date();

  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();

  const hour = now.getHours();
  const minute = now.getMinutes();

  const weekdays = [
    "日曜日",
    "月曜日",
    "火曜日",
    "水曜日",
    "木曜日",
    "金曜日",
    "土曜日"
  ];

  const weekday = weekdays[now.getDay()];
  const reiwa = y - 2018;

  let period = "";
  let message = "";

  if (hour >= 4 && hour < 10) {
    period = "朝です";
    message = "今日もゆっくり始めましょう";
  } else if (hour >= 10 && hour < 12) {
    period = "午前です";
    message = "今日は何曜日か確認しましょう";
  } else if (hour >= 12 && hour < 17) {
    period = "午後です";
    message = "無理せず過ごしましょう";
  } else if (hour >= 17 && hour < 21) {
    period = "夕方です";
    message = "そろそろ夜の時間です";
  } else {
    period = "夜です";
    message = "おやすみの準備をしましょう";
  }

  const mm = String(minute).padStart(2, "0");

  document.getElementById("year").innerHTML =
    y + "年<br>令和" + reiwa + "年";

  document.getElementById("date").textContent =
    m + "月" + d + "日";

  document.getElementById("weekday").textContent =
    weekday;

  document.getElementById("period").textContent =
    period;

  document.getElementById("time").textContent =
    hour + ":" + mm;

  document.getElementById("message").textContent =
    message;
}

async function loadSchedule() {
  const scheduleList = document.getElementById("https://script.google.com/macros/s/AKfycbxB-VV7QDz1dZK-_7SPKotuRVRPZ4pcuw1_8WBE1nESFD8n2L0-zmbRKVC9Jmp3pNpA8w/exec");

  try {
    const response = await fetch(SCHEDULE_URL);
    const events = await response.json();

    if (!events || events.length === 0) {
      scheduleList.className = "schedule-empty";
      scheduleList.textContent = "今日の予定はありません";
      return;
    }

    scheduleList.className = "";

    scheduleList.innerHTML = events
      .map(event => {
        return '<div class="schedule-item">' +
          event.time + "　" + event.title +
          '</div>';
      })
      .join("");

  } catch (error) {
    scheduleList.className = "schedule-empty";
    scheduleList.textContent = "予定を読み込めません";
  }
}

updateCalendar();
loadSchedule();

setInterval(updateCalendar, 1000);

// 予定は5分ごとに読み直し
setInterval(loadSchedule, 5 * 60 * 1000);

// 3時間ごとにページ全体を再読み込み
setInterval(() => {
  location.reload();
}, 3 * 60 * 60 * 1000);

// タップ時に全画面化を試みる
document.body.addEventListener("click", () => {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen();
  }
});
</script>

</body>
</html>
